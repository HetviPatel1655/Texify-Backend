version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: texify_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: texify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d texify"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: texify_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/texify?schema=public
      JWT_SECRET: change-this-to-a-long-random-secret
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: